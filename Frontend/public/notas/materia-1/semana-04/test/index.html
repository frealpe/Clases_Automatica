    let userAnswers = {};

    function renderQuestions() {
      const container = document.getElementById("questions-list");
      container.innerHTML = "";

      preguntas.forEach((q, idx) => {
        const card = document.createElement("div");
        card.className = "question-card";
        
        let html = `<h3>Pregunta ${idx + 1} (${q.tipo.toUpperCase()})</h3>`;
        html += `<p>${q.pregunta}</p>`;
        html += `<div class="options">`;

        q.opciones.forEach(opt => {
          html += `<button class="option-btn" onclick="selectOption('${q.id}', '${opt.id}', this)">${opt.id.toUpperCase()}) ${opt.texto}</button>`;
        });

        html += `</div>`;
        html += `<div id="exp-${q.id}" class="explanation"><strong>Explicación:</strong> ${q.explicacion}</div>`;
        
        card.innerHTML = html;
        container.appendChild(card);
      });

      if (window.MathJax) MathJax.typesetPromise();
    }

    function selectOption(qId, optId, btn) {
      userAnswers[qId] = optId;
      const q = preguntas.find(p => p.id === qId);
      const parent = btn.parentElement;
      const buttons = parent.querySelectorAll(".option-btn");

      buttons.forEach(b => {
        b.disabled = true;
        b.style.cursor = "default";
      });

      if (optId === q.correcta) {
        btn.classList.add("correct");
      } else {
        btn.classList.add("incorrect");
        buttons.forEach(b => {
          if (b.innerText.startsWith(q.correcta.toUpperCase() + ")")) {
            b.classList.add("correct");
          }
        });
      }

      document.getElementById(`exp-${qId}`).style.display = "block";
      updateScore();
    }

    function updateScore() {
      let score = 0;
      let count = 0;
      preguntas.forEach(q => {
        if (userAnswers[q.id]) {
          count++;
          if (userAnswers[q.id] === q.correcta) score++;
        }
      });

      const banner = document.getElementById("score-banner");
      banner.style.display = "block";
      document.getElementById("score-val").innerText = score;
      document.getElementById("score-text").innerText = `Has respondido ${count} de ${preguntas.length} preguntas.`;
    }

    document.addEventListener("DOMContentLoaded", renderQuestions);
  </script>
</body>
</html>
